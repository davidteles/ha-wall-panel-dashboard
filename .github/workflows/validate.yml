name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Syntax check of the shipped file
        run: npm run check
      - name: generate() and registration tests (no dependencies)
        run: npm test

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          # No README screenshot yet: a real one needs the acceptance run on a
          # test Home Assistant (docs/acceptance.md). Remove this before asking
          # for the default catalog, which requires images.
          ignore: images
